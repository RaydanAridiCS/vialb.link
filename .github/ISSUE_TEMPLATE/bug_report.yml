name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ToolWright version / image tag
      placeholder: e.g. v0.2.0 or ghcr.io/raydanaridics/toolwright:latest
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run ToolWright?
      options:
        - Docker Compose
        - Docker (other orchestrator)
        - Coolify / Dokploy
        - From source (npm run start)
        - Local development
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs or browser console output. Remove secrets and personal data.
      render: shell
