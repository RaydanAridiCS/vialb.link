# Git hooks (https://lefthook.dev). Enable once after cloning:
#   npx lefthook install
pre-commit:
  commands:
    lint-staged:
      run: npx lint-staged

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    unit-tests:
      run: npm run test:unit
