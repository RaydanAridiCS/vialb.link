# Git hooks (https://lefthook.dev). Enable once after cloning:
#   pnpm dlx lefthook install
pre-commit:
  commands:
    lint-staged:
      run: pnpm dlx lint-staged

commit-msg:
  commands:
    commitlint:
      run: pnpm dlx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm run typecheck
    unit-tests:
      run: pnpm run test:unit
