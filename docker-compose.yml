# Production-style stack: Vialb + PostgreSQL 17 (+ optional Redis).
#
#   cp .env.example .env      # set SITE_URL and BETTER_AUTH_SECRET
#   docker compose up -d      # → http://localhost:3000
#   docker compose --profile redis up -d   # with Redis (shared rate limits)
#   docker compose --profile backup up -d  # encrypted daily pg_dump (see docs/self-hosting.md)
#
# Uses the published image by default; `docker compose up --build` builds locally.
services:
  app:
    image: ghcr.io/raydanaridics/vialb.link:${VIALB_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vialb}:${POSTGRES_PASSWORD:-vialb}@postgres:5432/${POSTGRES_DB:-vialb}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vialb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vialb}
      POSTGRES_DB: ${POSTGRES_DB:-vialb}
    volumes:
      - vialb-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # Encrypted daily pg_dump to S3 / Cloudflare R2 or ./backups. See docs/self-hosting.md#backups.
  backup:
    build: ./scripts/backup
    restart: unless-stopped
    profiles: ["backup"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vialb}:${POSTGRES_PASSWORD:-vialb}@postgres:5432/${POSTGRES_DB:-vialb}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vialb-db:
